# One-command local deployment:  docker compose up --build
# The named volume keeps lab.db across container rebuilds (the app writes it
# through the /app/lab.db -> /data/lab.db symlink baked into the image).
services:
  nlm:
    build: .
    ports:
      - "8770:8770"
    volumes:
      - nlm-data:/data
    environment:
      # Set NLM_AUTH=off to run the app wide open (every request is admin).
      NLM_AUTH: ${NLM_AUTH:-on}
      # Demo seeding is off by default: the app starts EMPTY and bootstraps one
      # admin on first boot. Provide the password (else a random one is printed
      # to the logs once): docker compose logs, then change it in Admin > People.
      NLM_ADMIN_USER: ${NLM_ADMIN_USER:-admin}
      NLM_ADMIN_PASSWORD: ${NLM_ADMIN_PASSWORD:-}
      # Set to 1 to load the interactive demo lab instead (enables admin/admin).
      NLM_SEED_DEMO: ${NLM_SEED_DEMO:-}
      # Uncomment when serving over HTTPS (e.g. behind a TLS proxy):
      # NLM_SECURE_COOKIES: "1"
      # Daily email alert digest (optional). Set NLM_SCHEDULER=1 and the SMTP +
      # recipient vars to email a summary of open alerts once a day; without
      # them the digest is still viewable in-app (Settings > Email alert digest).
      NLM_SCHEDULER: ${NLM_SCHEDULER:-}
      NLM_DIGEST_TO: ${NLM_DIGEST_TO:-}
      NLM_DIGEST_HOUR: ${NLM_DIGEST_HOUR:-7}
      NLM_SMTP_HOST: ${NLM_SMTP_HOST:-}
      NLM_SMTP_PORT: ${NLM_SMTP_PORT:-587}
      NLM_SMTP_USER: ${NLM_SMTP_USER:-}
      NLM_SMTP_PASSWORD: ${NLM_SMTP_PASSWORD:-}
      NLM_SMTP_FROM: ${NLM_SMTP_FROM:-}
    restart: unless-stopped

volumes:
  nlm-data:
